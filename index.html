<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>希心之光｜靈魂探索群島</title>
  <!-- 引入字體：Noto Serif TC 營造溫潤的故事繪本感，Noto Sans TC 確保介面清晰可讀 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS 輔助響應式排版 -->
  
  

  
  <link rel="stylesheet" href="utilities.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="light-journey.css">
  <link rel="icon" href="data:,">
  <script src="light-journey.js" defer></script>
  <link rel="stylesheet" href="numerology.css">
  <script src="numerology-content.js" defer></script>
  <script src="numerology-diagram.js" defer></script>
  <script src="numerology.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-scene="story-1" class="selection:bg-paleGold/40">

  <!-- 背景柔和色階 -->
  <div class="world-backdrop" aria-hidden="true"></div>

  <!-- ==========================================================================
       頂部極簡導覽列（品牌標記 + 528Hz 音樂與情境控制按鈕）
       ========================================================================== -->
  <header class="relative z-20 w-full max-w-6xl mx-auto px-4 sm:px-8 pt-5 pb-2 flex items-center justify-between gap-2">
    <button id="brandHomeBtn" type="button" class="group flex items-center gap-2.5 text-left focus:outline-none" title="回到群島或故事起點">
      <span class="w-7 h-7 rounded-full bg-[#FAF6EE] border border-[#D9C59A] flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
        <span class="w-2.5 h-2.5 rotate-45 bg-[#D9C59A] block"></span>
      </span>
      <div>
        <span class="font-serif text-base sm:text-lg tracking-widest text-ink font-medium block leading-none">希心之光</span>
        <span class="text-[11px] tracking-[0.18em] text-inkLight block mt-0.5">靈魂探索群島</span>
      </div>
    </button>

    <!-- 右側情境動作鈕 -->
    <nav class="flex items-center flex-wrap justify-end gap-2" aria-label="故事與世界控制">
      <!-- 聲音開關按鈕（需使用者主動互動開啟或點擊故事推進後啟動） -->
      <button id="audioToggleBtn" type="button" class="btn-quiet" aria-pressed="false" title="切換 528Hz 背景音樂與豎琴音效">
        <svg id="audioIconMuted" class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8.5 3.5L5 6.5H2.5v3H5l3.5 3V3.5zM11.5 6l3 4m0-4l-3 4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg id="audioIconPlaying" class="w-3.5 h-3.5 hidden" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8.5 3.5L5 6.5H2.5v3H5l3.5 3V3.5zM11.2 5.5a3.5 3.5 0 0 1 0 5M13 3.8a6 6 0 0 1 0 8.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="audioToggleText">528Hz 音樂：開啟</span>
      </button>

      <button id="skipStoryBtn" type="button" class="btn-quiet">
        <span>跳過故事</span>
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 3l6 5-6 5M12 3v10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button id="skipGuideTopBtn" type="button" class="btn-quiet hidden">
        <span>直接進入群島</span>
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 3l6 5-6 5M12 3v10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button id="resumeGuideTopBtn" type="button" class="btn-quiet hidden">
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M10 13L5 8l5-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>返回小光對話</span>
      </button>

      <button id="talkToGuideTopBtn" type="button" class="btn-quiet hidden">
        <span class="w-2 h-2 rounded-full bg-[#D9C59A]"></span>
        <span>與小光對話</span>
      </button>

      <button id="backToMapTopBtn" type="button" class="btn-quiet hidden">
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M10 13L5 8l5-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>返回群島</span>
      </button>

      <button id="replayStoryBtn" type="button" class="btn-quiet hidden">
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2.5 8a5.5 5.5 0 1 1 1.6 3.9M2.5 4v4h4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>重看故事</span>
      </button>
    </nav>
  </header>

  <!-- ==========================================================================
       主要互動舞台容器
       ========================================================================== -->
  <main class="relative z-10 w-full max-w-6xl mx-auto px-4 sm:px-8 pb-12 min-h-[calc(100vh-76px)] flex flex-col justify-center">

    <!-- ========================================================================
         階段一：小靈魂的五幕開場故事 (Story Stage)
         ======================================================================== -->
    <section id="stageStory" class="stage-panel stage-active w-full flex flex-col items-center justify-between my-auto py-2">
      
      <!-- 互動幾何動畫畫布 (SVG) -->
      <div class="w-full max-w-2xl mx-auto aspect-[4/3] sm:aspect-[16/10] flex items-center justify-center relative">
        <svg id="storySvg" class="w-full h-full overflow-visible" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="小靈魂的故事場景">
          <defs>
            <!-- ==============================================================
                 「小靈魂」統一材質與光感漸層定義（暖奶白霧面陶土與柔和光體）
                 ============================================================== -->
            <!-- 頭部與身軀主材質：上方柔光暖奶白，下方溫潤霧面陶土米白 -->
            <radialGradient id="littleSoulClayLightGrad" cx="38%" cy="28%" r="70%" fx="32%" fy="22%">
              <stop offset="0%" stop-color="#FFFDF9"/>
              <stop offset="52%" stop-color="#F7F2E7"/>
              <stop offset="86%" stop-color="#EAE2D3"/>
              <stop offset="100%" stop-color="#DFD5C5"/>
            </radialGradient>

            <!-- 身體與短手腳溫潤立體陰影漸層 -->
            <linearGradient id="littleSoulTorsoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FAF6EC"/>
              <stop offset="65%" stop-color="#EDE5D6"/>
              <stop offset="100%" stop-color="#DDD2C0"/>
            </linearGradient>

            <!-- 角色周圍極柔和的暖白微光（非光環配件，而是光體本身的溫潤漫射） -->
            <radialGradient id="littleSoulSoftAuraGrad" cx="50%" cy="46%" r="50%">
              <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.58"/>
              <stop offset="60%" stop-color="#F6EFE2" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#F6EFE2" stop-opacity="0"/>
            </radialGradient>

            <!-- 地球圓形遮罩（確保緩慢自轉的陸地與白雲貼合球體） -->
            <clipPath id="earthSphereClip">
              <circle cx="0" cy="0" r="46"/>
            </clipPath>

            <!-- 彩虹橋柔和邊緣羽化濾鏡（避免像僵硬的發光直尺或雷射光束） -->
            <filter id="bridgeSoftGlow" x="-20%" y="-10%" width="140%" height="120%">
              <feGaussianBlur stdDeviation="2.2" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

            <!-- 第四幕：筆直朝正下方地球延伸、低飽和半透明的虹彩光橋縱向漸層 -->
            <linearGradient id="rainbowBridgeDepthGrad" x1="400" y1="158" x2="400" y2="376" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0.92"/>
              <stop offset="15%" stop-color="#FAF6EE" stop-opacity="0.82"/>
              <stop offset="82%" stop-color="#F2EFE9" stop-opacity="0.68"/>
              <stop offset="100%" stop-color="#E4ECEF" stop-opacity="0.18"/>
            </linearGradient>

            <!-- 橋體厚度側面柔和漸層 -->
            <linearGradient id="rainbowBridgeThicknessGrad" x1="400" y1="158" x2="400" y2="376" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#D9C59A" stop-opacity="0.48"/>
              <stop offset="50%" stop-color="#9FB6BC" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="#8E889B" stop-opacity="0.12"/>
            </linearGradient>

            <!-- 第三幕與第四幕：遠方下方柔和霧藍與淡金光暈 -->
            <radialGradient id="mistBlueSkyGrad" cx="50%" cy="68%" r="52%">
              <stop offset="0%" stop-color="#DCE7EE" stop-opacity="0.65"/>
              <stop offset="55%" stop-color="#F3EFE6" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#F7F4EE" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- 第一～四幕背景柔和幾何光圈（含奶油白、霧藍、淡金呼吸光層） -->
          <g id="storyAmbientGroup" class="transition-all duration-1000 anim-ambient-breathe">
            <ellipse id="ambientMistHorizon" cx="400" cy="340" rx="340" ry="145" fill="url(#mistBlueSkyGrad)" opacity="0.75"/>
            <circle id="ambientCircleOuter" cx="400" cy="230" r="195" fill="#EFECE6" opacity="0.45" class="transition-all duration-1000"/>
            <circle id="ambientCircleInner" cx="400" cy="230" r="130" fill="#FBF9F5" opacity="0.85" class="transition-all duration-1000"/>
            <!-- 極簡幾何星點（僅固定幾何小菱形，不使用雜亂粒子） -->
            <polygon points="210,115 213,121 219,124 213,127 210,133 207,127 201,124 207,121" fill="#D9C59A" opacity="0.45"/>
            <polygon points="595,125 598,130 603,133 598,136 595,141 592,136 587,133 592,130" fill="#D9C59A" opacity="0.4"/>
          </g>

          <!-- 整體鏡頭運鏡包裹層（第三幕第一人稱微推進、第四幕鏡頭平穩跟隨小靈魂） -->
          <g id="storyCameraRig" class="transition-transform duration-[1800ms] ease-in-out" style="transform: translate(0px, 0px) scale(1);">

            <!-- 遠方的精緻地球（第三幕位於遠方下方，占畫面寬度約 11.5% = 直徑 92px；第四幕位於光門正下方遙遠處） -->
            <g id="storyEarthGroup" class="transition-all duration-[1800ms] ease-in-out" style="opacity: 0; transform: translate(560px, 160px) scale(0.5);">
              <g class="anim-float-slow">
                <!-- 地球外圍溫柔光暈（奶油白與淡金、霧藍層次） -->
                <circle cx="0" cy="0" r="68" fill="#FAF6EE" opacity="0.65" class="anim-halo"/>
                <circle cx="0" cy="0" r="54" fill="#DCE8EE" opacity="0.55"/>

                <!-- 極細微的幾何星軌環 -->
                <ellipse cx="0" cy="0" rx="66" ry="18" transform="rotate(-12)" stroke="#D9C59A" stroke-width="1" stroke-dasharray="3 5" fill="none" opacity="0.6"/>

                <!-- 地球球體（柔和藍色海洋基底） -->
                <circle cx="0" cy="0" r="46" fill="#8FA6B8"/>

                <!-- 球體內部：緩慢轉動的綠色陸地與柔和白雲 -->
                <g clip-path="url(#earthSphereClip)">
                  <!-- 海洋淺層光澤 -->
                  <circle cx="-10" cy="-12" r="42" fill="#9BB3C4" opacity="0.65"/>

                  <!-- 緩慢自轉的綠色幾何陸地層 -->
                  <g class="anim-earth-land">
                    <!-- 主大陸（鼠尾草綠與柔綠切面） -->
                    <polygon points="-38,-22 -8,-34 16,-16 8,12 -18,16 -34,-2" fill="#9CAF9E"/>
                    <polygon points="-8,-34 16,-16 8,12" fill="#899E8B"/>
                    <!-- 南方島嶼陸塊 -->
                    <polygon points="12,16 36,10 44,28 22,38 8,28" fill="#A5B8A6"/>
                    <!-- 西側遠方陸塊 -->
                    <polygon points="-62,-6 -44,-18 -36,4 -48,22 -64,12" fill="#8FA391"/>
                    <!-- 東側延伸陸塊 -->
                    <polygon points="42,-24 62,-14 56,8 38,-4" fill="#9CAF9E"/>
                  </g>

                  <!-- 緩慢流動的柔和白雲層 -->
                  <g class="anim-earth-cloud" opacity="0.86">
                    <path d="M-32,-12 H6 C10,-12 12,-8 8,-6 H-28 C-34,-6 -36,-12 -32,-12 Z" fill="#FAF8F5"/>
                    <path d="M-8,12 H30 C35,12 36,17 30,18 H-4 C-10,18 -12,12 -8,12 Z" fill="#FFFFFF"/>
                    <path d="M-52,20 H-20 C-16,20 -16,25 -21,26 H-48 C-54,26 -56,20 -52,20 Z" fill="#F7F4EE"/>
                    <path d="M16,-26 H46 C50,-26 50,-21 45,-20 H20 C15,-20 13,-26 16,-26 Z" fill="#FAF8F5"/>
                  </g>

                  <!-- 球體立體柔和晨昏陰影面 -->
                  <path d="M32,-34 A46,46 0 0,1 -32,34 A48,42 0 0,0 32,-34 Z" fill="#5D7285" opacity="0.28"/>
                </g>

                <!-- 地球邊緣大氣微光環 -->
                <circle cx="0" cy="0" r="46" stroke="#FAF8F5" stroke-width="1.2" opacity="0.75" fill="none"/>
              </g>
            </g>

            <!-- 第四幕：第三人稱斜上方視角｜上方幾何光門、筆直朝正下方延伸的透視彩虹光橋 -->
            <g id="storyGateAndBridgeGroup" class="transition-all duration-1000" style="opacity: 0; transform: translate(0px, 0px);">
              
              <!-- 上方起點：光門所在的等角幾何高台 (中心 X=400, Y=148) -->
              <g id="act4OriginPlatform">
                <!-- 高台底部柔和光暈 -->
                <ellipse cx="400" cy="164" rx="74" ry="22" fill="#EAE2D3" opacity="0.5"/>
                <!-- 等角菱形高台頂面 -->
                <polygon points="400,124 468,148 400,172 332,148" fill="#F5F0E6"/>
                <!-- 等角高台左側立面 -->
                <polygon points="332,148 400,172 400,184 332,160" fill="#DFD7C8"/>
                <!-- 等角高台右側立面 -->
                <polygon points="468,148 400,172 400,184 468,160" fill="#CFC6B6"/>
              </g>

              <!-- 筆直向正下方遙遠地球下降的彩虹光橋（中心軸 X=400 筆直向下，透過上寬下窄透視表現空間深度與遙遠距離） -->
              <g id="storyRainbowBridge" class="transition-all duration-1000" style="opacity: 0;">
                <!-- 橋底柔和發光襯底（營造光凝聚成道路的溫潤空氣感） -->
                <polygon points="368,158 432,158 409,375 391,375" fill="url(#rainbowBridgeDepthGrad)" filter="url(#bridgeSoftGlow)" opacity="0.65"/>

                <!-- 橋體左、右側面些微立體厚度 (3D 空間層次) -->
                <polygon points="374,158 393,372 393,379 374,167" fill="url(#rainbowBridgeThicknessGrad)"/>
                <polygon points="426,158 407,372 407,379 426,167" fill="url(#rainbowBridgeThicknessGrad)"/>
                <!-- 橋面中央龍骨立體折線 -->
                <polygon points="393,372 407,372 407,379 393,379" fill="#9FB6BC" opacity="0.35"/>

                <!-- 五道筆直向遠方下方收斂的低飽和半透明虹彩光帶（淡粉、淡金、青綠、灰藍、淡紫） -->
                <g opacity="0.82">
                  <!-- 1. 淡粉 (Mist Pink) -->
                  <polygon points="374,158 384.4,158 395.8,372 393,372" fill="#DFC5C0" opacity="0.72"/>
                  <!-- 2. 淡金 (Pale Gold) -->
                  <polygon points="384.4,158 394.8,158 398.6,372 395.8,372" fill="#E5D4B3" opacity="0.72"/>
                  <!-- 3. 青綠 (Sage / Celadon) -->
                  <polygon points="394.8,158 405.2,158 401.4,372 398.6,372" fill="#B6C9BB" opacity="0.72"/>
                  <!-- 4. 灰藍 (Slate Blue) -->
                  <polygon points="405.2,158 415.6,158 404.2,372 401.4,372" fill="#A9C1CC" opacity="0.72"/>
                  <!-- 5. 淡紫 (Dusk Lavender) -->
                  <polygon points="415.6,158 426,158 407,372 404.2,372" fill="#C2BDCB" opacity="0.72"/>
                </g>

                <!-- 疊加縱向光澤漸層，使遠端自然融入地球上方的柔和雲氣，邊緣柔和不生硬 -->
                <polygon points="374,158 426,158 407,372 393,372" fill="url(#rainbowBridgeDepthGrad)" opacity="0.45"/>

                <!-- 兩側柔和光暈邊界線（非銳利直線，隨距離漸隱） -->
                <line x1="374" y1="158" x2="393" y2="372" stroke="#FAF8F5" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
                <line x1="426" y1="158" x2="407" y2="372" stroke="#FAF8F5" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

                <!-- 透視空間階梯刻度（越往下方地球越密集，強化由高處往遠方下方下降的透視感） -->
                <line x1="377" y1="186" x2="423" y2="186" stroke="#FAF8F5" stroke-width="1.1" opacity="0.5"/>
                <line x1="380" y1="216" x2="420" y2="216" stroke="#FAF8F5" stroke-width="1" opacity="0.45"/>
                <line x1="383" y1="244" x2="417" y2="244" stroke="#FAF8F5" stroke-width="0.95" opacity="0.4"/>
                <line x1="385.5" y1="270" x2="414.5" y2="270" stroke="#FAF8F5" stroke-width="0.9" opacity="0.35"/>
                <line x1="388" y1="294" x2="412" y2="294" stroke="#FAF8F5" stroke-width="0.85" opacity="0.3"/>
                <line x1="390" y1="316" x2="410" y2="316" stroke="#FAF8F5" stroke-width="0.8" opacity="0.25"/>
                <line x1="391.5" y1="336" x2="408.5" y2="336" stroke="#FAF8F5" stroke-width="0.75" opacity="0.2"/>
              </g>

              <!-- 簡潔的幾何光門（立於高台上方 X=400, Y=146，正對下方彩虹光橋與遙遠地球） -->
              <g id="storyGeometricGate" transform="translate(400, 146)">
                <!-- 光門開啟時的內部柔和光幕 -->
                <polygon id="gateInnerLight" points="-20,4 20,4 20,-78 -20,-78" fill="#FAF6EE" opacity="0" class="transition-opacity duration-1000"/>
                
                <!-- 光門左右展開的幾何門扉（第一階段緩慢向外敞開） -->
                <polygon id="gateDoorLeft" points="-20,4 0,4 0,-78 -20,-78" fill="#EFEAE0" opacity="0.9" class="transition-transform duration-[1400ms] ease-out" style="transform: translateX(0px);"/>
                <polygon id="gateDoorRight" points="0,4 20,4 20,-78 0,-78" fill="#E5DEC9" opacity="0.9" class="transition-transform duration-[1400ms] ease-out" style="transform: translateX(0px);"/>

                <!-- 左門柱（3D 等角立體切面） -->
                <polygon points="-30,6 -20,6 -20,-80 -30,-80" fill="#FAF8F5"/>
                <polygon points="-36,2 -30,6 -30,-80 -36,-84" fill="#DFD7C8"/>
                <!-- 右門柱（3D 等角立體切面） -->
                <polygon points="20,6 30,6 30,-80 20,-80" fill="#EAE3D5"/>
                <polygon points="30,6 36,2 36,-84 30,-80" fill="#CFC6B6"/>

                <!-- 頂部幾何冠樑與山形拱頂 -->
                <polygon points="0,-102 38,-80 28,-76 -28,-76 -38,-80" fill="#FAF8F5"/>
                <polygon points="-38,-80 38,-80 30,-74 -30,-74" fill="#DFD7C8"/>
                <!-- 門頂淡金幾何星芒菱形 -->
                <polygon points="0,-116 5,-106 0,-96 -5,-106" fill="#D9C59A"/>
              </g>

            </g>

            <!-- 第五幕：世界展開（六座幾何群島遠景浮現與雲霧散開） -->
            <g id="storyArchipelagoPreview" class="transition-all duration-1000" style="opacity: 0; transform: translateY(35px);">
              <!-- 1. 花精島 -->
              <g transform="translate(190, 290) scale(0.75)" class="anim-float-gentle">
                <polygon points="0,30 70,0 0,-30 -70,0" fill="#B8C9B9"/>
                <polygon points="-70,0 0,30 0,55 -70,25" fill="#9CAF9E"/>
                <polygon points="70,0 0,30 0,55 70,25" fill="#829684"/>
                <polygon points="-25,-5 0,-35 25,-5 0,10" fill="#DFC5C0"/>
              </g>
              <!-- 2. 光的課程島 -->
              <g transform="translate(320, 210) scale(0.8)" class="anim-float-slow">
                <polygon points="0,28 65,0 0,-28 -65,0" fill="#F2ECE1"/>
                <polygon points="-65,0 0,28 0,50 -65,22" fill="#DFD7C8"/>
                <polygon points="65,0 0,28 0,50 65,22" fill="#CCC2B0"/>
